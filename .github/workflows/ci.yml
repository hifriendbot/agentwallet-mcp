name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the npm the lock file was written with
        run: npm install -g npm@11.6.2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
